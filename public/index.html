<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オンライン大富豪</title>
  <link rel="stylesheet" href="/css/style.css?v=3.3">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- ロビー画面（入室前・待機中） -->
  <div id="lobby-container" class="container">
    <h1>♠♥ 大富豪オンライン ♦♣</h1>

    <!-- エラーメッセージ表示（ロビー用） -->
    <div id="lobby-error" class="error-banner" style="display:none;"></div>

    <!-- モード選択・入室フォーム -->
    <div id="lobby-form-area">
      <div class="tabs">
        <button id="tab-create" class="tab-btn active" onclick="switchTab('create')">ルームを作成</button>
        <button id="tab-join" class="tab-btn" onclick="switchTab('join')">ルームに参加</button>
      </div>

      <!-- ルーム作成フォーム -->
      <div id="form-create" class="form-panel">
        <div class="input-group">
          <label for="create-player-name">あなたの名前</label>
          <input type="text" id="create-player-name" placeholder="例: プレイヤー1" value="プレイヤー1">
        </div>
        <div class="input-group">
          <label for="create-room-id">合言葉（ルームID）</label>
          <input type="text" id="create-room-id" placeholder="例: daifugo-room" value="00000">
        </div>

        <div class="rules-section">
          <h3>採用するルール設定</h3>
          <p class="rules-always-on">常時適用: 革命 / マーク縛り / スペ3返し / 禁止上がり / 都落ち / ♢3スタート / ジョーカー</p>
          <div class="rules-grid">
            <label class="rule-checkbox">
              <input type="checkbox" id="rule-staircase" checked>
              <span><strong>階段</strong><small>同じマークの連番を出せる</small></span>
            </label>
            <label class="rule-checkbox">
              <input type="checkbox" id="rule-staircaseRevolution" checked>
              <span><strong>階段革命</strong><small>同じマークの連番4枚で革命発動</small></span>
            </label>
            <label class="rule-checkbox">
              <input type="checkbox" id="rule-elevenBack" checked>
              <span><strong>Jバック</strong><small>Jを含む出し方で一時的に強さ逆転</small></span>
            </label>
            <label class="rule-checkbox">
              <input type="checkbox" id="rule-numberLock" checked>
              <span><strong>連番縛り</strong><small>連番を出したら、その範囲を含むカードで出す</small></span>
            </label>
            <label class="rule-checkbox">
              <input type="checkbox" id="rule-fiveSkip" checked>
              <span><strong>5飛び</strong><small>5を出すと飛ばし、人数超過時は自分の番に戻る</small></span>
            </label>
            <label class="rule-checkbox">
              <input type="checkbox" id="rule-sevenPass" checked>
              <span><strong>7渡し</strong><small>7を出すと枚数分を次の人へ受け渡す</small></span>
            </label>
            <label class="rule-checkbox">
              <input type="checkbox" id="rule-tenDiscard" checked>
              <span><strong>10捨て</strong><small>10を出すと手札から1枚捨てる</small></span>
            </label>
          </div>
        </div>

        <button class="primary-btn" onclick="createRoom()">ルームを作成して待機</button>
      </div>

      <!-- ルーム参加フォーム -->
      <div id="form-join" class="form-panel" style="display:none;">
        <div class="input-group">
          <label for="join-player-name">あなたの名前</label>
          <input type="text" id="join-player-name" placeholder="例: プレイヤー2" value="プレイヤー2">
        </div>
        <div class="input-group">
          <label for="join-room-id">合言葉（ルームID）</label>
          <input type="text" id="join-room-id" placeholder="合言葉を入力" value="00000">
        </div>
        <button class="primary-btn" onclick="joinRoom()">ルームに参加する</button>
      </div>
    </div>

    <!-- 入室後待機エリア -->
    <div id="waiting-area" style="display:none;">
      <div class="room-info-card">
        <h2>合言葉: <span id="display-room-id" class="highlight-text"></span></h2>
        <div id="display-rules" class="rule-badges"></div>
        <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top: 12px;">
          <button id="copy-room-id-btn" class="secondary-btn" type="button" onclick="copyRoomId()">ルームIDをコピー</button>
          <button id="copy-room-link-btn" class="secondary-btn" type="button" onclick="copyRoomShareLink()">URLリンクをコピー</button>
        </div>
      </div>

      <div class="players-card">
        <h3>参加プレイヤー (<span id="player-count">0</span>/8人、CPU <span id="cpu-count">0</span>人)</h3>
        <div id="players-list" class="players-list"></div>
      </div>

      <div id="host-controls" style="display:none; margin-top: 20px;">
        <p id="host-start-hint" class="hint-text">2人以上揃うとゲームを開始できます</p>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button id="start-btn" class="primary-btn" onclick="startGame()" disabled>ゲーム開始</button>
          <label class="cpu-difficulty-control" for="cpu-difficulty-select">
            <span>CPUレベル</span>
            <select id="cpu-difficulty-select" class="cpu-difficulty-select">
              <option value="easy">かんたん</option>
              <option value="normal" selected>ふつう</option>
              <option value="hard">強い</option>
            </select>
          </label>
          <button id="add-cpu-btn" class="secondary-btn" type="button" onclick="addCpuPlayer()">CPUを追加</button>
          <button id="remove-cpu-btn" class="secondary-btn" type="button" onclick="removeCpuPlayer()" disabled>CPUを削除</button>
          <button id="room-lock-btn" class="secondary-btn" type="button" onclick="toggleRoomLock()">ルームをロック</button>
          <button id="close-room-btn" class="secondary-btn" onclick="closeCurrentRoom()">ルームを閉じる</button>
        </div>
        <p id="room-lock-status" class="hint-text" style="display:none;"></p>
      </div>
      <div id="guest-waiting-msg" style="display:none; margin-top: 20px;" class="hint-text">
        ホストがゲームを開始するのを待っています...
      </div>
    </div>
  </div>

  <!-- ゲーム画面 -->
  <div id="game-container" class="container" style="display:none;">
    <!-- ゲームヘッダー -->
    <div class="game-header">
      <div class="game-room-tag">合言葉: <span id="game-room-id"></span></div>
      <div class="game-header-actions">
        <div id="game-rules-badges" class="rule-badges"></div>
        <button id="overall-ranking-toggle" class="secondary-btn rules-toggle-btn" type="button" onclick="toggleOverallRanking()">総合順位</button>
        <button id="rules-toggle-btn" class="secondary-btn rules-toggle-btn" type="button" onclick="toggleRulesModal()">ルール</button>
      </div>
    </div>

    <!-- ページ上部エラー表示バナー（アラートの代わり） -->
    <div id="game-error" class="error-banner" role="alert" aria-live="assertive" style="display:none;"></div>

    <!-- 状況通知バナー（革命、11バック、縛りなど） -->
    <div id="game-status-banner" class="status-banner" role="status" aria-live="polite" style="display:none;">
      <div id="game-status-tags" class="game-status-tags"></div>
      <p id="game-action-message" class="game-action-message"></p>
    </div>

    <div class="table-stage">
      <!-- 場 -->
      <div class="field-section">
        <div class="field-title">場</div>
        <div id="previous-field-card" class="previous-field-card" aria-hidden="true" style="display:none;"></div>
        <div id="field" class="field-cards"></div>
        <div id="suit-lock-indicator" class="lock-indicator" style="display:none;"></div>
      </div>

      <!-- 他プレイヤー状態 -->
      <div class="others-section">
        <div id="other-players" class="other-players-grid"></div>
      </div>
    </div>

    <!-- ターン情報 & 操作ボタン -->
    <div class="turn-control-section">
      <div class="turn-status-box">
        <div class="turn-status-heading">
          <h3 id="turn-info" class="turn-text"></h3>
          <span id="turn-timer" class="turn-timer" style="display:none;"></span>
        </div>
        <p id="turn-detail" class="turn-detail"></p>
      </div>
      <div class="control-actions">
        <button id="play-btn" class="play-btn" onclick="submitPlayCards()">出す (0枚)</button>
        <button id="pass-btn" class="pass-btn" onclick="passTurn()">パスする</button>
      </div>
    </div>

    <!-- 自分の手札 -->
    <div class="hand-section">
      <div class="hand-header">
        <h3>手札 <small>カードを選択</small></h3>
      </div>
      <div id="hand" class="hand-cards"></div>
    </div>

      <!-- ルールポップアップ -->
    <div id="rules-modal" class="modal rules-modal" style="display:none;">
      <div class="modal-content rules-modal-content">
        <div class="rules-modal-header">
          <h2>ルール一覧</h2>
          <button type="button" class="secondary-btn" onclick="toggleRulesModal(false)">閉じる</button>
        </div>
        <div id="rules-modal-body" class="rules-modal-body"></div>
      </div>
    </div>

    <div id="overall-ranking-modal" class="modal overall-ranking-modal" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="live-overall-ranking-heading" onclick="if(event.target===this) toggleOverallRanking(false)">
      <div class="modal-content overall-ranking-modal-content">
        <div class="rules-modal-header">
          <div>
            <h2 id="live-overall-ranking-heading">総合順位</h2>
            <p id="live-overall-ranking-rounds" class="overall-ranking-rounds"></p>
          </div>
          <button class="secondary-btn" type="button" onclick="toggleOverallRanking(false)">閉じる</button>
        </div>
        <div id="live-overall-ranking-list" class="overall-ranking-list"></div>
      </div>
    </div>

    <!-- ゲーム終了ダイアログ -->
    <div id="game-finished-modal" class="modal" style="display:none;">
      <div class="modal-content game-finished-content">
        <h2>対戦結果</h2>
        <div id="ranking-list" class="ranking-list"></div>
        <section class="overall-ranking-section" aria-labelledby="overall-ranking-heading">
          <h3 id="overall-ranking-heading">総合順位</h3>
          <p id="overall-ranking-rounds" class="overall-ranking-rounds"></p>
          <div id="overall-ranking-list" class="overall-ranking-list"></div>
        </section>
        <div id="modal-next-controls" style="margin-top: 20px;">
          <button id="next-game-btn" class="primary-btn" onclick="nextRound()" style="display:none;">次のゲームを開始（カード交換あり）</button>
          <div id="guest-next-hint" class="hint-text" style="display:none;">ホストが次のゲームを開始するまでお待ちください</div>
          <button class="secondary-btn" onclick="location.reload()" style="margin-top: 10px;">ロビーに戻る</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js?v=2.22"></script>
</body>
</html>
